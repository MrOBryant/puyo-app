<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PUYO Group">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Prototype chatbot WhatsApp PUYO Member untuk tugas Strategic Management. Bukan akun resmi PUYO.">
<link rel="apple-touch-icon" href="img/wa-avatar.png">
<link rel="icon" type="image/png" href="img/wa-avatar.png">
<title>PUYO Group</title>
<link rel="stylesheet" href="chat.css?v=3">
</head>
<body>
<div id="shell">
  <!-- sidebar: hanya tampil di laptop (seperti WhatsApp Web) -->
  <div id="side">
    <div class="side-h">
      <div class="me-av" id="meAv"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.2 0-8 2.1-8 5v2h16v-2c0-2.9-3.8-5-8-5z"/></svg></div>
      <div class="side-icons">
        <button aria-label="Komunitas" data-toast="Fitur ini tidak tersedia di prototype"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.4"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M15 14.2c3 .1 6 1.6 6 4.8"/></svg></button>
        <button aria-label="Status" data-toast="Fitur ini tidak tersedia di prototype"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" stroke-dasharray="4 2.2"/><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/></svg></button>
        <button aria-label="Chat baru" data-toast="Fitur ini tidak tersedia di prototype"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6.5"/><path d="M17.5 3.5l3 3L12 15l-3.6.6.6-3.6z"/></svg></button>
      </div>
    </div>
    <div class="side-search"><div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="Cari atau mulai chat baru" aria-label="Cari"></div></div>
    <div class="side-tabs"><span class="on">Semua</span><span>Belum dibaca</span><span>Favorit</span><span>Grup</span></div>
    <div class="chatitem" id="chatItem">
      <img src="img/wa-avatar.png" alt="">
      <div class="ci">
        <div class="ci1"><div class="nm">PUYO Group <span class="vbadge"></span></div><div class="tm" id="ciTime"></div></div>
        <div class="pv" id="ciPrev">Ketik "Halo" untuk mulai</div>
      </div>
    </div>
    <div class="side-foot"><b>Prototype tugas Strategic Management</b><br>Kelompok 1 Branding 7C · Universitas Prasetiya Mulya<br>Bukan akun resmi PUYO. Data hanya tersimpan di perangkat ini.</div>
  </div>

  <!-- ruang chat -->
  <div id="chat">
    <header class="ch">
      <button class="back" id="back" aria-label="Kembali"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <img class="av" id="hAv" src="img/wa-avatar.png" alt="PUYO Group">
      <div class="who" id="who">
        <div class="nm">PUYO Group <span class="vbadge"></span></div>
        <div class="sub" id="sub">Akun bisnis</div>
      </div>
      <div class="icons">
        <button aria-label="Panggilan video" data-toast="Panggilan tidak tersedia di prototype"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg></button>
        <button aria-label="Panggilan suara" data-toast="Panggilan tidak tersedia di prototype"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6.6 3.5l2.5.4 1.2 4-1.9 1.6a12 12 0 0 0 6.1 6.1l1.6-1.9 4 1.2.4 2.5c-.6 2.2-2.4 3.1-4.4 3A17 17 0 0 1 3.6 7.9c-.1-2 .8-3.8 3-4.4z"/></svg></button>
        <button aria-label="Menu" id="dots"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
      </div>
    </header>

    <main id="msgs" aria-live="polite"><div id="feed"></div></main>
    <button class="scrolldown hide" id="sdown" aria-label="Ke pesan terbaru"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg><span class="cnt" hidden></span></button>

    <footer class="foot">
      <div class="field">
        <button id="emo" aria-label="Emoji"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.3"/><path d="M8.3 14.2c.9 1.4 2.2 2.1 3.7 2.1s2.8-.7 3.7-2.1"/><circle cx="9" cy="9.8" r=".9" fill="currentColor"/><circle cx="15" cy="9.8" r=".9" fill="currentColor"/></svg></button>
        <textarea id="inp" rows="1" placeholder="Ketik pesan" enterkeyhint="send" autocapitalize="sentences" aria-label="Ketik pesan"></textarea>
        <button id="att" aria-label="Lampirkan"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.7-7.7"/></svg></button>
        <button id="cam" aria-label="Kamera" data-toast="Kamera tidak tersedia di prototype"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.5-2h6.4l1.5 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.8" r="3.8"/></svg></button>
      </div>
      <button id="send" aria-label="Kirim">
        <svg id="icMic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v6a3.5 3.5 0 0 0 3.5 3.5zm6-3.5a6 6 0 0 1-12 0H4.5a7.5 7.5 0 0 0 6.75 7.46V22h1.5v-2.54A7.5 7.5 0 0 0 19.5 12z"/></svg>
        <svg id="icSend" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.99.99 0 0 0-1.38.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.02 4.61c0 .71.73 1.2 1.38.91z"/></svg>
      </button>
    </footer>
  </div>
</div>
<canvas id="confetti"></canvas>
<script src="outlets.js?v=3"></script>
<script src="chat.js?v=3"></script>
</body>
</html>
