<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PUYO">
<meta name="theme-color" content="#EAF5F5">
<meta name="description" content="Prototype konsep aplikasi PUYO untuk tugas Strategic Management. Bukan aplikasi resmi.">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" type="image/png" href="img/icon-180.png">
<link rel="manifest" href="manifest.json">
<title>PUYO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#519AA3; --teal-2:#3F8C96; --teal-d:#2C6F78; --teal-ink:#1D4C55;
  --teal-l:#DDF0F1; --teal-ll:#EEF8F8; --bg:#EAF5F5;
  --pink:#FF8BA3; --pink-l:#FFE4EA; --cream:#FFEEC9; --tan:#AA9482;
  --gold:#F6B83C; --ink:#1D3A40; --muted:#6A8489; --line:#D7E8E9; --card:#FFFFFF;
  --ok:#2E9E6B; --shadow:0 6px 18px rgba(31,90,99,.10); --shadow-s:0 2px 8px rgba(31,90,99,.08);
  --r:20px; --r-s:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior:none}
h1,h2,h3,.dosis{font-family:Dosis,Nunito,sans-serif;letter-spacing:.1px;margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;width:100%;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + var(--safe-b))}
#view.notab{padding-bottom:calc(110px + var(--safe-b))}
#view::-webkit-scrollbar{display:none}

/* desktop: show as phone */
.desk-note{display:none}
@media (min-width:700px){
  body{display:flex;align-items:center;justify-content:center;gap:56px;background:radial-gradient(circle at 30% 20%,#F4FBFB,#D3EAEB)}
  #app{height:min(880px,94vh);width:410px;margin:0;border-radius:46px;border:11px solid #fff;box-shadow:0 30px 80px rgba(29,76,85,.25),0 0 0 1px #cfe3e4}
  .desk-note{display:block;max-width:300px;color:var(--teal-ink)}
  .desk-note img{width:170px;margin-bottom:18px}
  .desk-note h2{font-size:28px;line-height:1.15;margin-bottom:10px}
  .desk-note p{color:var(--muted);margin:0 0 10px}
  .desk-note small{display:block;margin-top:18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
}

/* top bars */
.wavehead{position:relative;padding:calc(10px + var(--safe-t)) 18px 4px;background:linear-gradient(180deg,#D3ECEE 0%,var(--bg) 100%)}
.wavehead::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(120px 60px at 85% 0,#C3E4E6 60%,transparent 61%),radial-gradient(160px 70px at 10% -10px,#E3F3F4 60%,transparent 61%);opacity:.9;pointer-events:none}
.brandrow{position:relative;display:flex;align-items:center;justify-content:center;height:74px}
.brandrow img{height:70px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--teal-ink);position:relative}
.brandrow .iconbtn{position:absolute;right:-6px;top:8px}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--pink);border:2px solid var(--bg)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-t)) 10px 8px;background:rgba(234,245,245,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar h1{flex:1;text-align:center;font-size:22px;color:var(--teal-ink);font-weight:700;margin-right:42px}
.bar.tab h1{margin-left:42px}

.pad{padding:0 18px}
.hello{padding:8px 18px 14px}
.hello h1{font-size:25px;font-weight:800;color:var(--teal-ink)}
.hello p{margin:2px 0 0;color:var(--ink);font-size:15px}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.mode{background:linear-gradient(180deg,#fff,#F7FCFC);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid transparent;transition:transform .15s}
.mode:active{transform:scale(.97)}
.mode svg.big{width:58px;height:58px;stroke:var(--teal);stroke-width:1.6}
.mode b{font-family:Dosis;font-size:19px;color:var(--teal-ink)}
.mode small{color:var(--muted);font-size:12px;margin-top:-4px}

.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 18px 4px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.promo{flex:0 0 100%;scroll-snap-align:center;position:relative;border-radius:var(--r);overflow:hidden;min-height:128px;padding:16px 18px;color:#fff;background:linear-gradient(120deg,#5FB3B8,#3F8C96);box-shadow:var(--shadow);text-align:left}
.promo.pink{background:linear-gradient(120deg,#FF9FB2,#F07C96)}
.promo.cream{background:linear-gradient(120deg,#FFE7B8,#F5C97A);color:#5B4321}
.promo .kick{font-size:12.5px;font-weight:700;opacity:.9}
.promo h3{font-size:25px;line-height:1.05;margin-top:4px;max-width:60%;font-weight:800}
.promo p{margin:6px 0 0;font-size:12.5px;max-width:58%;opacity:.95}
.promo .cups{position:absolute;right:6px;bottom:-6px;width:150px;height:120px}
.promo .cups img{position:absolute;width:78px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.promo .go{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--teal-d);display:grid;place-items:center;box-shadow:var(--shadow-s)}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.dots i{width:6px;height:6px;border-radius:3px;background:#BFDADC;transition:width .2s}
.dots i.on{width:18px;background:var(--teal)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 18px 4px}
.quick button{background:#fff;border-radius:var(--r-s);box-shadow:var(--shadow-s);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--teal-ink)}
.quick svg.i{width:28px;height:28px}
.q-menu{color:var(--teal)} .q-promo{color:#F07C96} .q-rew{color:var(--gold)} .q-out{color:var(--teal-d)}

.sec{display:flex;align-items:baseline;justify-content:space-between;padding:20px 18px 10px}
.sec h2{font-size:19px;color:var(--teal-ink);font-weight:700}
.sec button{color:var(--teal-d);font-weight:800;font-size:13px}

.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow-s)}
.member{margin:14px 18px 0;padding:14px 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,#fff 55%,#F2FAFA)}
.coin{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFE27A,#F6B83C 70%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 3px 8px rgba(246,184,60,.35);color:#E0731F}
.coin svg{width:24px;height:24px;fill:#F08A24;stroke:#F08A24}
.member .t{flex:1;min-width:0}
.member .t small{color:var(--muted);font-size:12px}
.member .t b{display:block;font-family:Dosis;font-size:20px;color:var(--teal-ink)}
.prog{height:8px;border-radius:5px;background:var(--teal-l);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#5FB3B8,#3F8C96)}

.near{margin:0 18px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.pinbox{width:42px;height:42px;border-radius:12px;background:var(--teal-ll);color:var(--teal-d);display:grid;place-items:center;flex:none}
.near .t{flex:1;min-width:0}
.near b{display:block;font-size:15px;color:var(--teal-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.near small{color:var(--muted);font-size:12.5px}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 132px;padding:10px 10px 12px;text-align:center}
.mini img{width:96px;height:96px;object-fit:contain;margin:0 auto}
.mini b{display:block;font-size:13px;color:var(--teal-ink);margin-top:4px;line-height:1.2;min-height:32px}
.price{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:9px;background:var(--teal-l);color:var(--teal-ink);font-weight:800;font-size:13px}

.activeorder{margin:14px 18px 0;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--teal-ink);color:#fff;border-radius:var(--r-s)}
.activeorder .t{flex:1}
.activeorder small{opacity:.8;font-size:12px}
.pulse{width:10px;height:10px;border-radius:50%;background:#7FF0C9;box-shadow:0 0 0 0 rgba(127,240,201,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(127,240,201,0)}100%{box-shadow:0 0 0 0 rgba(127,240,201,0)}}

/* menu */
.search{margin:4px 18px 10px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 14px;height:44px;box-shadow:var(--shadow-s);color:var(--muted)}
.search input{flex:1;border:0;outline:0;background:none;height:100%;color:var(--ink);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:20px;background:#fff;box-shadow:var(--shadow-s);font-weight:700;font-size:14px;color:var(--teal-ink)}
.chip.on{background:linear-gradient(180deg,#5FB3B8,#3F8C96);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.prod{position:relative;padding:12px 10px 12px;text-align:center;display:flex;flex-direction:column;align-items:center}
.prod img{width:118px;height:110px;object-fit:contain}
.prod .stack{position:relative;width:128px;height:110px}
.prod .stack img{position:absolute;width:76px;height:76px}
.prod b{font-size:14px;color:var(--teal-ink);line-height:1.2;margin-top:4px;min-height:34px;display:flex;align-items:center}
.prod .old{font-size:11.5px;color:var(--muted);text-decoration:line-through;margin-top:2px}
.fav{position:absolute;top:8px;right:8px;width:32px;height:32px;display:grid;place-items:center;color:var(--teal-ink)}
.fav.on svg{fill:var(--pink);stroke:var(--pink)}
.badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--teal);color:#fff;letter-spacing:.3px}
.badge.pink{background:var(--pink)}
.addbtn{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-s)}
.addbtn svg.i{width:18px;height:18px;stroke-width:2.6}
.prod .price{margin-right:24px}
.empty{padding:40px 30px;text-align:center;color:var(--muted)}
.empty svg{width:56px;height:56px;color:#B5D3D5;stroke-width:1.4}

.cartbar{position:absolute;left:14px;right:14px;bottom:calc(78px + var(--safe-b));z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--teal-ink);color:#fff;box-shadow:0 10px 26px rgba(29,76,85,.35);animation:up .25s ease}
.notab ~ .cartbar{bottom:calc(16px + var(--safe-b))}
.cartbar .n{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--teal-ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.cartbar .t{flex:1;font-weight:700}
.cartbar .t small{display:block;font-weight:600;opacity:.75;font-size:11.5px}
@keyframes up{from{transform:translateY(20px);opacity:0}}

/* tabbar */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 4px calc(8px + var(--safe-b));border-top:1px solid var(--line)}
#tabbar.hide{display:none}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:#7B9296;padding:4px 0;position:relative}
#tabbar button.on{color:var(--teal-d)}
#tabbar button.on svg{fill:var(--teal-l)}
#tabbar .cnt{position:absolute;top:0;left:55%;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;font-size:10px;display:grid;place-items:center}

/* forms & lists */
.box{margin:0 18px 12px;padding:16px}
.label{font-family:Dosis;font-weight:700;font-size:17px;color:var(--teal-ink);margin:16px 18px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;padding:6px;border-radius:18px;margin:4px 18px 4px;box-shadow:var(--shadow-s)}
.seg button{height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;color:var(--teal-ink)}
.seg button.on{background:linear-gradient(180deg,#5FB3B8,#3F8C96);color:#fff;box-shadow:var(--shadow-s)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;color:var(--teal-ink);font-size:15px}
.row .t small{color:var(--muted);font-size:12.5px}
.rows .row+.row{border-top:1px solid var(--line)}
.line{display:flex;align-items:center;gap:12px;padding:12px 14px}
.line img{width:50px;height:50px;object-fit:contain;flex:none}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:14.5px;color:var(--teal-ink)}
.line .t small{color:var(--muted);font-size:12px;display:block}
.step{display:flex;align-items:center;gap:2px;background:var(--teal-ll);border-radius:12px;padding:3px}
.step button{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--teal-d)}
.step button:active{background:#fff}
.step span{min-width:22px;text-align:center;font-weight:800}
.step svg.i{width:16px;height:16px;stroke-width:2.6}
.outline{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;margin:4px 18px;border:1.8px solid var(--teal);border-radius:14px;color:var(--teal-d);font-weight:800;font-size:15px;background:#fff;width:calc(100% - 36px)}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:12px 14px;outline:0;font-size:16px}
.field input:focus,.field textarea:focus{border-color:var(--teal)}
.field textarea{resize:none;height:76px}
.tchips{display:flex;gap:8px;flex-wrap:wrap}
.tchip{padding:9px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:var(--teal-ink)}
.tchip.on{border-color:var(--teal);background:var(--teal-ll);color:var(--teal-d)}
.sum .r{display:flex;justify-content:space-between;padding:4px 0;font-size:14.5px}
.sum .r.disc{color:var(--ok);font-weight:700}
.sum .r.tot{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:17px;color:var(--teal-ink)}
.earn{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:#FFF6DF;color:#8A5B12;font-size:13px;font-weight:700}
.earn svg{width:18px;height:18px;fill:var(--gold);stroke:var(--gold)}
.rider{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--teal-ll);margin-top:10px}
.rider .av{width:42px;height:42px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none}
.rider small{display:block;color:var(--muted);font-size:12px}
.rider b{color:var(--teal-ink);font-size:14px}

.cta{position:absolute;left:0;right:0;bottom:0;z-index:16;padding:12px 18px calc(14px + var(--safe-b));background:linear-gradient(180deg,rgba(234,245,245,0),var(--bg) 30%)}
.btn{width:100%;height:54px;border-radius:16px;background:linear-gradient(180deg,#5FB3B8,#3A8892);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 20px rgba(63,140,150,.35);display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5}
.btn.ghost{background:#fff;color:var(--teal-d);box-shadow:var(--shadow-s);border:1.8px solid var(--teal)}
.btn.pinkb{background:linear-gradient(180deg,#FF9FB2,#F07C96);box-shadow:0 8px 20px rgba(240,124,150,.35)}
.btn small{font-weight:700;opacity:.85}

/* payment */
.paytot{margin:6px 18px 6px;padding:18px;text-align:center}
.paytot small{color:var(--teal-ink);font-weight:600}
.paytot b{display:block;font-family:Dosis;font-size:34px;color:var(--teal-ink);font-weight:800}
.pm{display:flex;align-items:center;gap:14px;margin:0 18px 10px;padding:14px 16px;border:2px solid transparent;width:calc(100% - 36px);text-align:left}
.pm.on{border-color:var(--teal)}
.pm .lg{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:900;font-size:11px}
.pm .t{flex:1}
.pm .t b{display:block;font-size:16px;color:var(--teal-ink)}
.pm .t small{color:var(--muted);font-size:12.5px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #A8BFC2;flex:none;display:grid;place-items:center}
.pm.on .radio{border-color:var(--teal)}
.pm.on .radio::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--teal)}
.demo-note{margin:6px 18px;padding:10px 12px;border-radius:12px;background:#FFF6DF;color:#7A5410;font-size:12.5px;display:flex;gap:8px}
.demo-note svg{width:18px;height:18px}

/* rewards */
.ptcard{margin:6px 18px 0;padding:18px;border-radius:var(--r);background:linear-gradient(120deg,#A6DADC,#7CC3C7);display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.ptcard .coin{width:62px;height:62px}
.ptcard .coin svg{width:32px;height:32px}
.ptcard .t{flex:1}
.ptcard small{color:var(--teal-ink);font-weight:700;font-size:14px}
.ptcard b{display:block;font-family:Dosis;font-size:30px;color:var(--teal-ink);font-weight:800;line-height:1.1}
.qrbtn{width:62px;height:62px;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--teal-ink);box-shadow:var(--shadow-s)}
.qrbtn svg.i{width:36px;height:36px}
.nextrw{margin:16px 18px 4px;display:flex;align-items:center;gap:14px}
.nextrw .t{flex:1}
.nextrw small{font-size:13.5px}
.nextrw b{display:block;font-family:Dosis;font-size:19px;color:var(--teal-ink)}
.nextrw .prog{height:12px;margin-top:8px}
.gift{width:52px;height:52px;flex:none}
.listbtn{display:flex;align-items:center;gap:14px;margin:0 18px 10px;padding:14px 16px;width:calc(100% - 36px);text-align:left}
.listbtn .ic{width:44px;height:44px;border-radius:12px;background:var(--teal-ll);color:var(--teal-d);display:grid;place-items:center;flex:none}
.listbtn .ic.gold{background:#FFF3D6;color:#E59B1A}
.listbtn .t{flex:1}
.listbtn b{display:block;font-size:16px;color:var(--teal-ink)}
.listbtn small{color:var(--muted);font-size:12.5px}
.listbtn>svg.i{color:var(--teal-ink)}
.rw{display:flex;align-items:center;gap:12px;padding:12px 0}

.tier.on{border-color:var(--teal);background:var(--teal-ll)}

.tier b{display:block;color:var(--teal-ink)}
.tier small{color:var(--muted);font-size:12.5px}

.ticket .l{width:92px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-family:Dosis;font-weight:800;text-align:center;padding:10px 6px;line-height:1}

.ticket .l small{font-size:11px;font-weight:700;opacity:.9}
.ticket .r{flex:1;padding:12px 14px;border-left:2px dashed var(--line);position:relative}
.ticket .r::before,.ticket .r::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.ticket .r::before{top:-8px}.ticket .r::after{bottom:-8px}
.ticket b{display:block;color:var(--teal-ink);font-size:15px}
.ticket p{margin:3px 0 8px;font-size:12.5px;color:var(--muted)}
.ticket .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--teal-d);background:var(--teal-ll);padding:4px 8px;border-radius:7px}
.excl{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:#C2486A;background:var(--pink-l);padding:3px 8px;border-radius:7px;margin-bottom:4px;letter-spacing:.3px}
.locked .ticket{filter:blur(3.5px);opacity:.75;pointer-events:none}
.lockwrap{position:relative}
.lockcta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}

/* sheet */
#sheet-root{position:absolute;inset:0;z-index:40;pointer-events:none}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);pointer-events:auto}
.open .scrim{opacity:1}.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#D5E3E4;margin:0 auto 10px}

.pimg{background:radial-gradient(circle at 50% 60%,var(--teal-ll),#fff 70%);border-radius:20px;margin:0 -4px 12px;display:grid;place-items:center;height:210px;position:relative}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}

.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin:4px 0 8px}

.hint b{color:var(--teal-d)}

.celebrate .coin svg{width:46px;height:46px}
.celebrate h1{font-size:28px;color:var(--teal-ink)}
.celebrate p{color:var(--ink)}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* account */
.prof{margin:6px 18px 14px;padding:18px;display:flex;align-items:center;gap:14px}
.prof .av{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#5FB3B8,#3F8C96);color:#fff;display:grid;place-items:center;font-family:Dosis;font-weight:800;font-size:26px}
.prof b{display:block;font-size:19px;color:var(--teal-ink);font-family:Dosis}
.prof small{color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px;background:#FFF3D6;color:#B07410}
.lvl svg{width:14px;height:14px}
.about{font-size:13.5px;color:var(--ink)}
.about p{margin:0 0 10px}

#toast{position:absolute;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,40px);opacity:0;transition:transform .25s,opacity .25s;z-index:60;background:var(--teal-ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.2);max-width:88%;pointer-events:none;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
.qrbig{display:grid;place-items:center;padding:14px;background:#fff;border-radius:18px;border:1.5px solid var(--line);margin:8px auto 10px;width:236px}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--teal-l);border-top-color:var(--teal);animation:sp 0.8s linear infinite;margin:30px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}}
</style>
</head>

const KEY='puyo-proto-v1';
function defaults(){return{user:null,guest:false,points:0,lifetime:0,vouchers:[],cart:[],mode:'pickup',outlet:null,pickupTime:'asap',address:'',addrNote:'',voucher:null,pay:'qris',ewallet:'GoPay',favs:['milk','mango'],orders:[],loc:null,locLabel:'Jakarta Selatan',locDemo:true,city:'',pointLog:[],notifSeen:false}}

/* ---------- geo ---------- */
function hav(a,b){const R=6371,t=x=>x*Math.PI/180;const dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const userLoc=()=>S.loc||CITY['Jakarta Selatan'];
function nearestCity(p){let best=null,bd=1e9;for(const c of CITIES){const d=hav(p,CITY[c]);if(d<bd){bd=d;best=c}}return best}
function distOf(o){const base=hav(userLoc(),CITY[o.city]);const j=(hash(o.name)%1000)/1000;return Math.max(.3,base*0.85+0.4+j*4.2)}
function sortedOutlets(){return OUT.map(o=>Object.assign({},o,{d:distOf(o)})).sort((a,b)=>a.d-b.d)}
const km=d=>d<10?d.toFixed(1).replace('.',',')+' km':Math.round(d)+' km';
function curOutlet(){if(S.outlet!=null&&OUT[S.outlet])return Object.assign({},OUT[S.outlet],{d:distOf(OUT[S.outlet])});return sortedOutlets()[0]}

/* ---------- cart & pricing ---------- */
const cartCount=()=>S.cart.reduce((a,l)=>a+l.qty,0);
const lineKey=(id,fl)=>id+(fl&&fl.length?':'+fl.join(','):'');
function addToCart(id,qty,flavors){const k=lineKey(id,flavors);const ex=S.cart.find(l=>l.key===k);if(ex)ex.qty+=qty;else S.cart.push({key:k,id,qty,flavors:flavors||null});save()}
function singleCups(){return S.cart.filter(l=>prod(l.id).cat==='silky').reduce((a,l)=>a+l.qty,0)}
function totalCups(){return S.cart.reduce((a,l)=>{const p=prod(l.id);return a+l.qty*(p.cups||1)},0)}
function voucherCheck(code){
  const sub=S.cart.reduce((a,l)=>a+prod(l.id).price*l.qty,0);
  const h=new Date().getHours();
  const has=t=>S.cart.some(l=>prod(l.id).cat===t);
  switch(code){
    case 'PUYOBARU': return S.orders.length?{ok:false,why:'Hanya untuk pesanan pertama'}:{ok:true,disc:Math.min(sub*.5,15000)};
    case 'B3G1': {const n=singleCups();return n>=4?{ok:true,disc:Math.floor(n/4)*15000}:{ok:false,why:`Tambah ${4-n} cup Silky lagi`}}
    case 'ONGKIRNOL': if(S.mode!=='delivery')return{ok:false,why:'Khusus delivery'}; return totalCups()>=3?{ok:true,ship:true}:{ok:false,why:'Min. 3 cup'};
    case 'SILKYHOUR': return (h>=14&&h<17)?{ok:true,disc:Math.min(sub*.2,20000)}:{ok:false,why:'Berlaku jam 14.00–17.00'};
    case 'RW-CUP': return has('silky')?{ok:true,disc:15000}:{ok:false,why:'Tambah 1 cup Silky'};
    case 'RW-ONGKIR': return S.mode==='delivery'?{ok:true,ship:true}:{ok:false,why:'Khusus delivery'};
    case 'RW-PAKET': return has('paket')?{ok:true,disc:10000}:{ok:false,why:'Tambah paket dulu'};
  }
  return {ok:false,why:''};
}
function totals(){
  const sub=S.cart.reduce((a,l)=>a+prod(l.id).price*l.qty,0);
  let disc=0,ship=S.mode==='delivery'?DELIVERY_FEE:0,vc=null;
  if(S.voucher&&S.vouchers.includes(S.voucher)){const r=voucherCheck(S.voucher);if(r.ok){vc=S.voucher;if(r.disc)disc=Math.min(r.disc,sub);if(r.ship)ship=0}}
  const total=sub-disc+ship;
  const mult=1+(tier().i===1?.1:tier().i===2?.25:0);
  const pts=Math.floor((sub-disc)/1000*5*mult);
  return{sub,disc,ship,total,vc,pts,shipBase:S.mode==='delivery'?DELIVERY_FEE:0};
}

function qrSVG(seed,size){const n=29;let h=hash(seed)||1;const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};let d='';const finder=(x,y)=>{d+=`M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5zM${x+2} ${y+2}h3v3h-3z`};const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y))continue;if(rnd()<.48)d+=`M${x} ${y}h1v1h-1z`}finder(0,0);finder(n-7,0);finder(0,n-7);return`<svg viewBox="-1 -1 ${n+2} ${n+2}" width="${size}" height="${size}" shape-rendering="crispEdges"><path fill="#1D3A40" fill-rule="evenodd" d="${d}"/></svg>`}

function placeOrder(){

  S.orders.unshift(order);

  const tm=k=>{const d=new Date(o.created+st[k][2]*1000);return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};
  const deli=o.mode==='delivery';
  return{html:`${bar('Pesanan #'+o.id,{right:''})}
  ${p.fresh&&si===0?`<div class="demo-note" style="background:#E3F4EA;color:#1F7A50">${ic('check')}<span>Pembayaran berhasil via ${esc(o.pay)}. Status di bawah berjalan otomatis untuk simulasi.</span></div>`:''}
  ${deli?`<div class="map">${mapSVG()}<span class="eta" id="eta">${done?'Sudah sampai':si<2?'Estimasi 25–35 menit':'Rider sedang di jalan'}</span></div>`

  ${deli?`<div class="card box"><div class="rider" style="margin:0;background:none;padding:0"><span class="av">${ic('user')}</span><span style="flex:1"><b>${o.rider[0]}</b><small>PUYO Rider · ${o.rider[1]}</small></span><button class="iconbtn" style="background:var(--teal-ll)" data-act="toast" data-v="Fitur chat rider aktif di aplikasi versi final">${ic('chat')}</button><button class="iconbtn" style="background:var(--teal-ll)" data-act="toast" data-v="Fitur telepon rider aktif di aplikasi versi final">${ic('phone')}</button></div>
   <small style="display:block;color:var(--muted);margin-top:10px">Diantar ke: ${esc(o.address||'-')}</small></div>`
   :`<div class="card row" style="margin:0 18px 12px"><span class="pinbox">${ic('pin')}</span><span class="t"><b>${esc(o.outletName)}</b><small>${esc(o.floor)} · ${esc(o.city)}</small></span><a class="smallbtn line2" href="${esc(o.outletMaps)}" target="_blank" rel="noopener">Maps</a></div>`}
  <div class="card box sum">${o.lines.map(l=>{const pr=prod(l.id);return`<div class="r"><span>${l.qty}× ${pr.name}</span><span>${rp(pr.price*l.qty)}</span></div>`}).join('')}
   ${o.disc?`<div class="r disc"><span>Diskon ${o.vc}</span><span>−${rp(o.disc)}</span></div>`:''}
   ${deli?`<div class="r"><span>Ongkir PUYO Rider</span><span>${o.ship?rp(o.ship):'Gratis'}</span></div>`:''}

function mapSVG(){return`<svg viewBox="0 0 360 200" id="mapsvg"><rect width="360" height="200" fill="#EEF3EC"/>
 <g stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"><path d="M-10 60H370M-10 150H370M70 -10V210M200 -10V210M300 -10V210"/></g>
 <g stroke="#fff" stroke-width="6" fill="none"><path d="M-10 105H370M135 -10V210M250 -10V210"/></g>
 <rect x="85" y="72" width="38" height="24" rx="4" fill="#DCE8D7"/><rect x="214" y="118" width="26" height="22" rx="4" fill="#DCE8D7"/><rect x="262" y="20" width="28" height="30" rx="4" fill="#DCE8D7"/><circle cx="165" cy="30" r="16" fill="#CFE5C9"/>
 <path id="route" d="M42 150H135V105H250V60H318" fill="none" stroke="#3F8C96" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9"/>
 <g transform="translate(42 150)"><circle r="13" fill="#fff" stroke="#3F8C96" stroke-width="3"/><text y="4" text-anchor="middle" font-size="10" font-weight="800" fill="#2C6F78" font-family="Dosis">PUYO</text></g>
 <g transform="translate(318 60)"><path d="M0 0c-8-9-12-15-12-21a12 12 0 0 1 24 0c0 6-4 12-12 21z" fill="#FF8BA3"/><circle cy="-21" r="4.5" fill="#fff"/></g>
 <g id="rider"><circle r="15" fill="#1D4C55"/><path transform="translate(-9 -9) scale(.75)" d="${ICONS.scooter}" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`}
function placeRider(o){const path=$('#route'),r=$('#rider');if(!path||!r)return;const st=DELI_STAGES;const el=(Date.now()-o.created)/1000;const f=Math.max(0,Math.min(1,(el-st[2][2])/(st[3][2]-st[2][2])));const L=path.getTotalLength();const pt=path.getPointAtLength(L*f);r.setAttribute('transform',`translate(${pt.x} ${pt.y})`);const eta=$('#eta');if(eta&&el>=st[2][2]&&f<1)eta.textContent=`Tiba ± ${Math.max(1,Math.ceil((1-f)*12))} menit`}

/* promo */
SCREENS.promo=()=>{
  const ticket=(code,v,opts={})=>`<div class="ticket"><div class="l" style="background:${v.color}"><big>${v.big}</big><small>${v.small}</small></div><div class="r"><span class="excl">${ic('lock')}KHUSUS APP</span><b>${v.title}</b><p>${v.desc}</p><div class="foot"><span class="code">${code}</span>${opts.btn||''}</div></div></div>`;
  const app=['PUYOBARU','B3G1','ONGKIRNOL','SILKYHOUR'];
  if(!S.user)return{html:`${bar('Promo Khusus App')}<div class="lockwrap locked">${app.map(c=>ticket('••••••',VOUCHERS[c])).join('')}<div class="lockcta"><span class="lk">${ic('lock')}</span><h3>4 promo masih terkunci</h3><p>Promo ini tidak diumumkan di mana pun. Cuma bisa dilihat setelah kamu daftar di app PUYO.</p><button class="btn" data-act="go" data-v="register">Daftar & Buka Promo</button></div></div>`};
  const mine=S.vouchers;
  return{html:`${bar('Promo Khusus App')}
  <p style="margin:0 18px 14px;color:var(--muted);font-size:13.5px">Promo ini cuma ada untuk member app PUYO, tidak dipasang di gerai atau ojol.</p>
  ${mine.length?mine.map(c=>ticket(c,VOUCHERS[c],{btn:`<button class="smallbtn" data-act="usev" data-v="${c}">${S.voucher===c?'Terpasang ✓':'Pakai'}</button>`})).join(''):`<div class="empty">${ic('ticket')}<p>Semua voucher sudah terpakai.</p></div>`}
  ${S.orders.length&&!mine.includes('PUYOBARU')?`<div style="opacity:.55">${ticket('PUYOBARU',VOUCHERS.PUYOBARU,{btn:'<span class="pill">Sudah dipakai</span>'})}</div>`:''}`};
};

/* outlets */
SCREENS.outlets=(p)=>{
  const city=S.city||'';const q=(p.q||'').toLowerCase();const lim=p.lim||30;
  let list=sortedOutlets();if(city)list=list.filter(o=>o.city===city);if(q)list=list.filter(o=>(o.name+' '+o.city).toLowerCase().includes(q));
  const cur=curOutlet();
  return{html:`${bar('Gerai PUYO')}
  <div class="card locbar"><span class="pinbox" style="width:36px;height:36px">${ic('target')}</span><span class="t"><small>Lokasimu${S.locDemo?' (demo)':''}</small><b>${esc(S.locLabel)}</b></span><button class="smallbtn" data-act="geo">Pakai lokasi saya</button></div>
  <label class="search">${ic('search')}<input id="oq" placeholder="Cari mal atau kota" value="${esc(p.q||'')}"></label>
  <div class="selectw"><select id="city"><option value="">Semua kota (${OUT.length} gerai)</option>${CITIES.map(c=>`<option ${c===city?'selected':''}>${c}</option>`).join('')}</select></div>
  ${list.slice(0,lim).map(o=>`<div class="card out ${o.i===cur.i?'sel':''}"><span class="pinbox">${ic('pin')}</span><div class="t"><b>${esc(o.name)}</b><small>${esc(o.floor)} · ${esc(o.city)}</small>
   <div class="acts"><button class="smallbtn ${o.i===cur.i?'off':''}" data-act="pickout" data-v="${o.i}">${o.i===cur.i?'Gerai dipilih':'Pilih gerai ini'}</button><a class="smallbtn line2" href="${esc(o.maps)}" target="_blank" rel="noopener">Buka Maps</a></div></div><span class="km">± ${km(o.d)}</span></div>`).join('')}
  ${list.length>lim?`<button class="outline" data-act="more">Tampilkan lebih banyak (${list.length-lim} lagi)</button>`:''}
  ${!list.length?`<div class="empty">${ic('pin')}<p>Gerai tidak ditemukan.</p></div>`:''}
  <p style="text-align:center;color:var(--muted);font-size:11.5px;margin:14px 30px">Data gerai dari puyodesserts.com. Jarak adalah perkiraan.</p>`,
  after:()=>{$('#city').addEventListener('change',e=>{S.city=e.target.value;save();R.p.lim=30;render(true)});const i=$('#oq');i.addEventListener('input',()=>{R.p.q=i.value;const pos=i.selectionStart;render();const n=$('#oq');n.focus();n.setSelectionRange(pos,pos)})}};
};

/* account */
SCREENS.account=()=>{
  if(!S.user)return{html:`${bar('Akun',{tab:true})}<div class="celebrate"><img src="img/logo.png" style="width:150px;margin:10px auto 16px"><h1>Belum masuk</h1><p>Daftar untuk simpan pesanan, kumpulkan poin, dan buka promo khusus app.</p><button class="btn" style="margin-top:16px" data-act="go" data-v="register">Daftar / Masuk</button></div>
  <button class="card listbtn" data-act="about"><span class="ic">${ic('info')}</span><span class="t"><b>Tentang prototype ini</b></span>${ic('chev')}</button>`};
  const t=tier();
  return{html:`${bar('Akun',{tab:true})}
  <div class="card prof"><span class="av">${esc(S.user.name[0].toUpperCase())}</span><span><b>${esc(S.user.name)}</b><small>+62 ${esc(S.user.phone)}</small><br><span class="lvl">${ic('crown')}${t.name}</span></span></div>
  <button class="card listbtn" data-act="tab" data-v="orders"><span class="ic">${ic('clip')}</span><span class="t"><b>Pesanan Saya</b><small>${S.orders.length} pesanan</small></span>${ic('chev')}</button>
  <button class="card listbtn" data-act="go" data-v="promo"><span class="ic" style="background:var(--pink-l);color:#F07C96">${ic('ticket')}</span><span class="t"><b>Voucher Saya</b><small>${S.vouchers.length} aktif</small></span>${ic('chev')}</button>
  <button class="card listbtn" data-act="cat2fav"><span class="ic">${ic('heart')}</span><span class="t"><b>Menu Favorit</b><small>${S.favs.length} rasa</small></span>${ic('chev')}</button>
  <button class="card listbtn" data-act="go" data-v="outlets"><span class="ic">${ic('pin')}</span><span class="t"><b>Gerai Pilihan</b><small>${esc(curOutlet().name)}</small></span>${ic('chev')}</button>
  <button class="card listbtn" data-act="privacy"><span class="ic">${ic('shield')}</span><span class="t"><b>Privasi & Data</b><small>Sesuai UU PDP</small></span>${ic('chev')}</button>
  <button class="card listbtn" data-act="about"><span class="ic">${ic('info')}</span><span class="t"><b>Tentang prototype ini</b></span>${ic('chev')}</button>
  <button class="card listbtn" data-act="reset"><span class="ic" style="background:#FDECEC;color:#D04848">${ic('refresh')}</span><span class="t"><b>Reset data demo</b><small>Mulai lagi dari awal</small></span></button>
  <button class="card listbtn" data-act="logout"><span class="ic" style="background:#FDECEC;color:#D04848">${ic('logout')}</span><span class="t"><b>Keluar</b></span></button>`};
};

/* ---------- sheet & toast ---------- */
const sroot=$('#sheet-root');
function openSheet(html){sroot.innerHTML=`<div class="scrim" data-close></div><div class="sheet">${html}</div>`;sroot.style.pointerEvents='auto';requestAnimationFrame(()=>requestAnimationFrame(()=>sroot.classList.add('open')));$('.scrim',sroot).addEventListener('click',()=>closeSheet());return $('.sheet',sroot)}
function closeSheet(now){sroot.classList.remove('open');sroot.style.pointerEvents='none';if(now)sroot.innerHTML='';else setTimeout(()=>{if(!sroot.classList.contains('open'))sroot.innerHTML=''},300)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300)}

/* ---------- actions ---------- */
const A={
 tab:d=>tab(d.v), go:(d,el)=>{go(d.v,{pick:el.dataset.pick})}, back:()=>back(),
 guest:()=>{S.guest=true;save();tab('home')},
 mode:d=>{S.mode=d.v;save();tab('menu');toast(d.v==='delivery'?'Mode Delivery · diantar PUYO Rider':'Mode Pick-up · ambil di gerai')},
 setmode:d=>{S.mode=d.v;save();render()},
 cat:d=>{R.p.cat=d.v;render()},
 cat2fav:()=>{stack.length=0;R={name:'menu',p:{cat:'fav'}};render(true)},
 product:d=>openProduct(d.v),
 quickadd:d=>{addToCart(d.v,1,null);toast(prod(d.v).name+' masuk keranjang');render()},
 fav:d=>{const i=S.favs.indexOf(d.v);if(i>=0)S.favs.splice(i,1);else S.favs.push(d.v);save();render()},
 checkout:()=>go('checkout'),
 qty:(d,el)=>{const l=S.cart.find(x=>x.key===el.dataset.k);if(!l)return;l.qty+= +d.v;if(l.qty<=0)S.cart=S.cart.filter(x=>x!==l);save();render()},
 ptime:d=>{S.pickupTime=d.v;save();render()},
 vsheet:()=>{
   if(!S.user){regPrompt('Promo khusus app terbuka setelah kamu daftar.');return}
   const sh=openSheet(`<div class="grab"></div><h2>Pilih Promo</h2><p class="sub">Satu promo per pesanan.</p>${S.vouchers.length?S.vouchers.map(c=>{const v=VOUCHERS[c],r=voucherCheck(c);return`<div class="rw"><span class="pinbox" style="background:${v.color};color:#fff;font-family:Dosis;font-weight:800">${v.big}</span><span class="t"><b>${v.title}</b><small>${r.ok?'Bisa dipakai':esc(r.why)}</small></span><button class="smallbtn ${r.ok?'':'off'}" data-v="${c}" ${r.ok?'':'disabled'}>${S.voucher===c?'Lepas':'Pakai'}</button></div>`}).join(''):'<p class="sub">Belum ada voucher.</p>'}`);
   sh.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b||b.disabled)return;S.voucher=S.voucher===b.dataset.v?null:b.dataset.v;save();closeSheet();render();if(S.voucher)toast('Promo '+S.voucher+' dipakai')});
 },
 topay:()=>{if(!S.user){regPrompt('Daftar dulu supaya pesanan & poinmu tersimpan.');return}if(S.mode==='delivery'&&S.address.trim().length<8){toast('Isi alamat pengantaran dulu ya');const a=$('#addr');if(a)a.focus();return}go('payment')},
 pay:d=>{S.pay=d.v;save();render()}, ew:d=>{S.ewallet=d.v;save();render()},
 paynow:()=>{
   const t=totals();
   if(S.pay==='qris'){const sh=openSheet(`<div class="grab"></div><h2 style="text-align:center">Scan QRIS</h2><p class="sub" style="text-align:center">Total ${rp(t.total)} · berlaku <b id="cd">10:00</b></p><div class="qrbig">${qrSVG('pay'+Date.now(),200)}</div><p class="sub" style="text-align:center;font-size:12px">QR ini palsu (prototype). Tekan tombol di bawah untuk simulasi bayar.</p><button class="btn" id="paid">Saya Sudah Bayar</button>`);let s=600;const iv=setInterval(()=>{s--;const e=$('#cd',sh);if(!e){clearInterval(iv);return}e.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},1000);$('#paid',sh).addEventListener('click',()=>{clearInterval(iv);processing()});return}
   processing();
 },
 track:d=>go('track',{id:d.v}),
 reorder:d=>{const o=S.orders.find(x=>x.id===d.v);if(!o)return;o.lines.forEach(l=>addToCart(l.id,l.qty,l.flavors));S.mode=o.mode;S.outlet=o.outlet;save();stack.length=0;R={name:'home',p:{}};go('checkout')},
 promoslide:d=>{if(d.v==='lock'){go('promo');return}S.voucher=d.v;save();tab('menu');toast('Promo '+d.v+' dipasang. Pilih menunya!')},
 usev:d=>{S.voucher=S.voucher===d.v?null:d.v;save();if(S.voucher){toast('Promo '+d.v+' dipasang');if(S.cart.length)go('checkout');else tab('menu')}else render()},
 pickout:d=>{S.outlet=+d.v;save();toast('Gerai dipilih: '+OUT[+d.v].name);if(stack.length&&stack[stack.length-1].name==='checkout')back();else render()},
 more:()=>{R.p.lim=(R.p.lim||30)+30;render()},
 geo:()=>{if(!navigator.geolocation){toast('Lokasi tidak tersedia di perangkat ini');return}toast('Mencari lokasimu…');navigator.geolocation.getCurrentPosition(pos=>{S.loc=[pos.coords.latitude,pos.coords.longitude];const c=nearestCity(S.loc);S.locLabel='Dekat '+c;S.locDemo=false;S.city='';S.outlet=null;save();render(true);toast('Gerai diurutkan dari yang terdekat')},()=>toast('Izin lokasi ditolak, pakai lokasi demo'),{timeout:10000,maximumAge:600000})},
 notif:()=>{S.notifSeen=true;save();render();openSheet(`<div class="grab"></div><h2>Notifikasi</h2>${[['ticket','Promo rahasia minggu ini',S.user?'Buy 3 Get 1 pakai kode B3G1, cuma di app.':'Daftar untuk lihat promo khusus app.'],['star','Poin jadi dessert',S.user?`Kamu punya ${S.points} poin. 500 poin = 1 Silky Dessert gratis.`:'Daftar dapat 350 poin sambutan.'],['sparkle','Rasa baru: Silky Peach','Manis dan harum, sudah ada di semua gerai.']].map(n=>`<div class="rw"><span class="pinbox">${ic(n[0])}</span><span class="t"><b>${n[1]}</b><small>${n[2]}</small></span></div>`).join('')}`)},
 memberqr:()=>openSheet(`<div class="grab"></div><h2 style="text-align:center">QR Member</h2><p class="sub" style="text-align:center">Tunjukkan di kasir gerai untuk kumpulkan poin</p><div class="qrbig">${qrSVG('member'+S.user.phone,200)}</div><p style="text-align:center;font-family:Dosis;font-weight:800;color:var(--teal-ink);font-size:18px;margin:0">${esc(S.user.name)} · ${tier().name}</p>`),
 redeem:()=>{const sh=openSheet(`<div class="grab"></div><h2>Tukar Poin</h2><p class="sub">Poinmu: <b>${S.points}</b>. Hasil tukar masuk ke Voucher Saya.</p>${REWARDS.map(r=>`<div class="rw">${r.img==='scooter'?`<span class="pinbox" style="width:52px;height:52px">${ic('scooter')}</span>`:r.img==='p'?`<div style="width:52px">${stackImg(prod('p3'),46)}</div>`:`<img src="${img(r.img)}" alt="">`}<span class="t"><b>${r.name}</b><small>${r.cost} poin</small></span><button class="smallbtn ${S.points>=r.cost?'':'off'}" data-r="${r.id}" ${S.points>=r.cost?'':'disabled'}>Tukar</button></div>`).join('')}`);
   sh.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b||b.disabled)return;const r=REWARDS.find(x=>x.id===b.dataset.r);if(S.vouchers.includes(r.id)){toast('Voucher ini masih ada, pakai dulu ya');return}S.points-=r.cost;S.vouchers.push(r.id);S.pointLog.unshift({t:Date.now(),d:'Tukar: '+r.name,p:-r.cost});save();closeSheet();render();toast(r.name+' masuk Voucher Saya')})},
 ptlog:()=>openSheet(`<div class="grab"></div><h2>Riwayat Poin</h2>${S.pointLog.map(l=>`<div class="rw"><span class="t"><b>${esc(l.d)}</b><small>${new Date(l.t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></span><b style="color:${l.p>0?'var(--ok)':'#D04848'}">${l.p>0?'+':''}${l.p}</b></div>`).join('')||'<p class="sub">Belum ada.</p>'}`),
 tiers:()=>{const t=tier();openSheet(`<div class="grab"></div><h2>Level Member</h2><p class="sub">Total poin terkumpul: <b>${S.lifetime}</b></p>${TIERS.map((x,i)=>`<div class="tier ${i===t.i?'on':''}"><span class="cr" style="background:${x.color}22;color:${x.color}">${ic('crown')}</span><span><b>${x.name}${i===t.i?' · level kamu':''}</b><small>${x.min?`Mulai ${x.min.toLocaleString('id-ID')} poin terkumpul · `:''}${x.perk}</small></span></div>`).join('')}`)},
 privacy:()=>openSheet(`<div class="grab"></div><h2>Privasi & Data</h2><div class="about"><p>Di aplikasi final, data pelanggan (nama, nomor HP, riwayat pesanan, poin) dikelola sesuai UU No. 27/2022 tentang Pelindungan Data Pribadi: hanya dipakai untuk pesanan & program loyalitas, bisa dihapus kapan saja, dan tidak dijual ke pihak lain.</p><p>Di prototype ini semua data <b>hanya tersimpan di HP kamu</b> dan tidak dikirim ke server mana pun.</p></div>`),
 about:()=>openSheet(`<div class="grab"></div><img src="img/logo.png" style="width:120px;margin:0 auto 10px"><h2 style="text-align:center">Tentang prototype</h2><div class="about"><p>Prototype konsep aplikasi PUYO untuk tugas Strategic Management, sebagai turunan rekomendasi strategi <b>Market Penetration</b>: aplikasi pemesanan sendiri dengan QRIS, program poin, paket hemat, dan promo khusus app untuk mendorong pembelian berulang dan mengurangi ketergantungan pada platform pihak ketiga.</p><p><b>Bukan aplikasi resmi PUYO.</b> Pesanan, pembayaran, rider, dan poin hanya simulasi. Logo, foto produk, dan daftar gerai diambil dari puyodesserts.com untuk keperluan tugas.</p></div>`),
 reset:()=>{const sh=openSheet(`<div class="grab"></div><h2>Reset data demo?</h2><p class="sub">Akun, poin, pesanan, dan keranjang di HP ini akan dihapus.</p><button class="btn pinkb" id="rs">Ya, reset</button><button class="btn ghost" style="margin-top:10px" data-close2>Batal</button>`);$('#rs',sh).onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=defaults();stack.length=0;closeSheet(true);R={name:'splash',p:{}};render(true)};$('[data-close2]',sh).onclick=()=>closeSheet()},
 logout:()=>{S.user=null;S.guest=false;S.vouchers=[];S.points=0;S.lifetime=0;S.pointLog=[];S.voucher=null;save();stack.length=0;R={name:'splash',p:{}};render(true)},
 toast:d=>toast(d.v),
 reg1:()=>{const name=$('#f-name').value.trim(),phone=$('#f-phone').value.replace(/\D/g,'').replace(/^0|^62/,'');if(name.length<2){toast('Isi nama dulu ya');return}if(phone.length<9){toast('Nomor HP belum lengkap');return}if(!$('#f-agree').checked){toast('Centang persetujuan data dulu');return}R.p={step:2,name,phone,bday:$('#f-bday').value};render(true)},
 otpfill:()=>{document.querySelectorAll('[data-otp]').forEach((e,i)=>e.value='1234'[i]);A.reg2()},
 reg2:()=>{const v=[...document.querySelectorAll('[data-otp]')].map(e=>e.value).join('');if(v!=='1234'){toast('Kode salah. Pakai 1234');return}const p=R.p;S.user={name:p.name,phone:p.phone,bday:p.bday};S.guest=false;S.points+=350;S.lifetime+=350;S.vouchers=['PUYOBARU','B3G1','ONGKIRNOL','SILKYHOUR'].filter(c=>!(c==='PUYOBARU'&&S.orders.length));S.pointLog.unshift({t:Date.now(),d:'Bonus selamat datang',p:350});save();stack.length=0;R={name:'register',p:{step:3}};render(true)}
};
function regPrompt(msg){const sh=openSheet(`<div class="grab"></div><div style="text-align:center"><div class="coin" style="width:64px;height:64px;margin:6px auto 12px">${ic('star')}</div><h2>Daftar dulu, yuk</h2><p class="sub">${msg}<br>Bonus 350 poin + 4 promo khusus app langsung aktif.</p></div><button class="btn" id="rg">Daftar Sekarang</button>`);$('#rg',sh).onclick=()=>go('register')}
function processing(){const sh=openSheet(`<div class="grab"></div><div class="spin"></div><p style="text-align:center;font-weight:800;color:var(--teal-ink)">Memproses pembayaran…</p><p class="sub" style="text-align:center">${S.pay==='ewallet'?'Menghubungkan ke '+S.ewallet+' (simulasi)':'Simulasi pembayaran'}</p>`);setTimeout(placeOrder,1500)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!document.getElementById('app').contains(el))return;const a=A[el.dataset.act];if(!a)return;e.stopPropagation();if(el.tagName==='BUTTON'||el.getAttribute('role')==='button')e.preventDefault();a(el.dataset,el)});

/* ticker for order simulation */
let lastSig='';
setInterval(()=>{if(!S.orders.length)return;const changed=creditOrders();const sig=S.orders.map(o=>o.id+':'+stageIdx(o)).join('|');
  if(R.name==='track'){const o=S.orders.find(x=>x.id===R.p.id);if(o&&o.mode==='delivery')placeRider(o)}
  if(sig!==lastSig||changed){const first=!lastSig;lastSig=sig;if(!first&&!sroot.classList.contains('open')&&['track','orders','home'].includes(R.name))render()}
},1000);

creditOrders();
render(true);
})();
</script>
</body>
</html>
